name: test
# main, release branches (rel-*) and tags only: a round's own branch is work in progress, tested where it is built,
# and each of its failed pushes was an email to the owner (2026-11-11)
on:
  push:
    branches: [main, "rel-*"]
    tags: ["v*"]
  pull_request:
jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/formats.test.mjs
      - run: node tests/doctor.test.mjs
      # hashes are written at the release: on a round's branch a stale one is reported, on main and tags it fails
      - run: node tests/sw.test.mjs ${{ startsWith(github.ref, 'refs/heads/rel-') && '--wip' || '' }}
      # text people type, outside the happy path: tidy, glyph coverage, file names, saved designs (category 9)
      - run: node tests/text.test.mjs
      # every file leaves through js/gate.js; damaged files through Open never offer a file the gate refuses
      - run: node tests/gate.test.mjs
      - run: node tests/sewn_lint.mjs
      - run: node tests/open_fuzz.test.mjs
      - run: node tests/flow_lint.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # independent check (no shared code with formats.js): design box, PES block, hoop fit, stitch rules
      - run: python tests/pe900_check.py --writer-only tests/fixtures/golden/*.pes

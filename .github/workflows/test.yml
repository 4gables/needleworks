name: test
on: [push, pull_request]
jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/formats.test.mjs
      - run: node tests/doctor.test.mjs
      - run: node tests/sw.test.mjs
      # every file leaves through js/gate.js; damaged files through Open never offer a file the gate refuses
      - run: node tests/gate.test.mjs
      - run: node tests/open_fuzz.test.mjs
      - run: node tests/flow_lint.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # independent check (no shared code with formats.js): design box, PES block, hoop fit, stitch rules
      - run: python tests/pe900_check.py --writer-only tests/fixtures/golden/*.pes

<!doctype html><meta charset="utf-8"><title>font check</title>
<link rel="stylesheet" href="../../css/app.css">
<style>body{display:block} .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px} canvas{width:100%;height:560px;background:#f3eeec;border-radius:8px} p{margin:0;font:12px monospace}</style>
<div class="grid" id="g"></div>
<script type="module">
import { buildBookmark } from "../../js/core/bookmark.js";
import { hoop } from "../../js/core/machines.js";
import { designStats } from "../../js/core/formats.js";
import { draw, colorBlocks } from "../../js/render.js";
const fams = [...document.styleSheets].flatMap((s) => { try { return [...s.cssRules]; } catch { return []; } })
  .filter((r) => r.type === 5).map((r) => r.style.getPropertyValue("font-family").replace(/"/g, "")).filter((f) => f.startsWith("NW "));
const name = new URLSearchParams(location.search).get("name") || "Josephine";
for (const f of fams) {
  await document.fonts.load(`40px "${f}"`);
  const div = document.createElement("div"); const c = document.createElement("canvas"); const p = document.createElement("p");
  div.append(c, p); g.append(div);
  const t0 = performance.now();
  try {
    const d = buildBookmark({ name, family: f, hoop: hoop() }).pattern();
    const st = designStats(d);
    p.textContent = `${f.slice(3)}: ${st.stitches} st, ${(performance.now()-t0).toFixed(0)} ms`;
    draw(c, d, { fabric: "pink", fabricShapeBlock: 0, hide: new Set([0,1,3]), cache: colorBlocks(d) });
  } catch (e) { p.textContent = f + " ERROR " + e.message; console.error(e); }
}
</script>

<!doctype html><meta charset="utf-8"><title>PE900 batch</title>
<link rel="stylesheet" href="../../css/app.css">
<style>body{display:block;padding:12px;font:13px monospace} pre{white-space:pre-wrap}</style>
<p>Builds every bookmark font × name × swash setting (before/after on/off) and a set of pictures with the site's own code, then POSTs each
PES to <code>/save/&lt;name&gt;</code>. Serve with <code>tests/batch_server.py</code>, then run
<code>tests/pe900_check.py</code> on the saved files.</p>
<pre id="log"></pre>
<script type="module">
import { buildBookmark } from "../../js/core/bookmark.js";
import { hoop as getHoop } from "../../js/core/machines.js";
import { writePES, validatePES } from "../../js/core/formats.js";
import { analyze, digitize, workingSize } from "../../js/core/digitize.js";

const hoop = getHoop(), log = (s) => (document.getElementById("log").textContent += s + "\n");
import { FONTS } from "../../js/core/fonts.js";
import { turnPattern } from "../../js/core/design.js";
const names = ["ashley", "Ashley", "Emma", "Olivia", "Ann", "bob", "Zoë", "Mia", "Katherine", "Maximiliana", "Jo", "W", "Grace-Lynn", "Quinn", "jayden"];
let n = 0, bad = 0;
async function save(name, pattern) {
  const bytes = writePES(pattern), v = validatePES(bytes, pattern, hoop);
  if (!v.ok) { bad++; log(`INVALID ${name}: ${v.error}`); }
  await fetch(`/save/${encodeURIComponent(name)}.pes`, { method: "POST", body: bytes });
  n++;
}
const only = new URLSearchParams(location.search).get("only");   // "pic" or "bm" to run half
if (only !== "pic") await save("bm_blank", buildBookmark({ blank: true, hoop }).pattern());
for (const { family: f, print } of only === "pic" ? [] : FONTS) {
  await document.fonts.load(`40px "${f}"`);
  // index in the tag: "ashley" and "Ashley" would share a file on a case-insensitive disk
  for (const [ni, name] of names.entries()) for (const lead of [true, false]) for (const tail of [true, false]) {
    const tag = `bm_${f.slice(3).replace(/ /g, "")}_${ni}${name.normalize("NFKD").replace(/[^A-Za-z-]/g, "")}_${lead ? "L" : ""}${tail ? "T" : ""}`;
    try { await save(tag, buildBookmark({ name, family: f, hoop, lead, tail, print }).pattern()); }
    catch (e) { bad++; log(`ERROR ${tag}: ${e.message}`); }
  }
  log(`${f}: done`);
}
const pics = ["../../assets/sample-flower.png", ...Array.from({ length: 8 }, (_, i) => `../external/images/etsy_${i + 1}.jpg`)];
for (const src of only === "bm" ? [] : pics) {
  let bmp; try { bmp = await createImageBitmap(await (await fetch(src)).blob()); } catch { log(`skip ${src}`); continue; }
  // turned: digitized in the sideways hoop, then turned into the machine's orientation like the site does
  for (const colors of [2, 4, 8]) for (const size of [60, 100, 170]) for (const turn of size === 170 ? [false, true] : [false]) {
    const field = turn ? { ...hoop, w: hoop.h, h: hoop.w } : hoop, sz = workingSize(bmp.width, bmp.height, size, field);
    const c = new OffscreenCanvas(sz.w, sz.h), ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high"; ctx.drawImage(bmp, 0, 0, sz.w, sz.h);
    const img = ctx.getImageData(0, 0, sz.w, sz.h), opts = { colors, removeBackground: true, fillAngle: 45, skip: [], hoop: field };
    const tag = `pic_${src.split("/").pop().split(".")[0]}_c${colors}_s${size}${turn ? "_turned" : ""}`;
    try { const p = digitize(img, analyze(img, opts), opts).design.pattern(); await save(tag, turn ? turnPattern(p) : p); }
    catch (e) { bad++; log(`ERROR ${tag}: ${e.message}`); }
  }
  log(`${src}: done`);
}
log(`DONE ${n} files, ${bad} problems`);
document.title = `DONE ${n} ${bad}`;
</script>
